[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muxpy"
version = "0.1.0"
description = "Ultra-light, modern, and asynchronous Python wrapper for Termux:API on Android"
readme = "README.md"
authors = [
    { name = "Developer" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/muxpy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
